<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tes HTML GitHub</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
    main { border: 1px solid #8888; border-radius: 1rem; padding: 1.5rem; }
    .status { font-weight: 700; }
    button { padding: .6rem 1rem; border-radius: .5rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Tes HTML berhasil dimuat</h1>
    <p>Halaman ini dibuat sebagai tes koneksi ChatGPT ke repositori GitHub <code>js3k/js3k.github.io</code>.</p>
    <p class="status" id="status">JavaScript belum diuji.</p>
    <button id="test-button" type="button">Uji JavaScript</button>
    <p><a href="./">Kembali ke halaman utama</a></p>
  </main>
  <script>
    document.getElementById("test-button").addEventListener("click", function () {
      document.getElementById("status").textContent = "Berhasil: JavaScript berjalan!";
    });
  </script>
</body>
</html>
